  - id: R-002
    severity: low
    type: stale-page-header
    description: |
      show/presenting.md line 7 still says "Confidence: `code` (nothing was
      run)" while the page now contains [observed, 2026-11-09] claims in the
      End of show / Spacebar sections and the changelog records the move from
      code to observed. The header contradicts the page body. It does not
      affect this candidate, but a reader could mislabel the page.
    owner: reader
    affects_implementer: false
  - id: R-003
    severity: info
    type: documented-deviation
    description: |
      The reader run shows press 3 at the end of the last show selecting the
      following section (output unchanged), and press 4 doing nothing. The
      contract explicitly puts "sections as selectable project items" out of
      scope (DEV-009), and B3 says "no next_show -> no change". Our engine
      therefore does nothing after the last show's last slide, while FreeShow
      selects the section. This is a contract-approved deviation, not a defect
      for DEV-015; a future project-item model must revisit it.
    owner: orchestrator
    affects_implementer: false

