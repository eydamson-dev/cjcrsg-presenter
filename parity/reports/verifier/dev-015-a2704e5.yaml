reference_findings:
  - id: R-001
    severity: low
    type: inventory
    description: |
      The contract and the feature registry use `nav.bounds.next-at-end`, but
      that ID does not exist in docs/freeshow-reference/feature-inventory.md.
      The detail page is show/presenting.md under the IDs show.present and
      show.present.active. The reader should add the inventory row/alias or the
      contract should cite the reference ID. The understanding note cites the
      right page sections, so the implementation is not affected.
    owner: reader
