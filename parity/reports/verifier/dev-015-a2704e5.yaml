b_clauses:
  - id: B1
    requirement: two state positions; both start on the first show with a slide; explicit navigation sets selected to the landed show; selection-only change bumps the revision, leaves the output slide and starts no transition.
    result: pass
    basis: static_review
    evidence:
      - "crates/core/src/engine.rs:117 `selected_show` field; :151 constructor seeds it from `order.first()`; :369 replace_project resets it the same way."
      - "crates/core/src/engine.rs:610-624 go_to_index retargets the selection even when the index is already live, via select_show; go_to, go_to_show, first_slide, last_slide, next_section and next_group all land through go_to_index."
      - "crates/core/src/engine.rs:479-487 select_show sets `transition = None` and increments the revision without touching `index`."
      - "crates/core/src/engine.rs:690-711 bump() sets selected from the landed position for real slide moves."
      - "parity/reports/evidence/dev-015/outline-after-first-press-1280x820.png: rev 1, preview still welcome-1, Welcome LIVE, Parity Fixture SELECTED."
    notes: "The first press publishes revision 1 with transition None (test next_at_show_end_selects_then_plays asserts both)."
  - id: B2
    requirement: next inside a show advances in one press; selected follows to the same show.
    result: pass
    basis: static_review
    evidence:
      - "crates/core/src/engine.rs:455-459 `next.show == current.show` -> index += 1 and bump; bump sets selected to the landed show."
      - "crates/core/src/engine.rs:1022-1038 next_within_show_is_unchanged asserts one press and selected == Some(0)."
    notes: "Crossing an empty group is covered by the same test (a2 -> b1)."
  - id: B3
    requirement: at the end of a show with the setting on, press 1 selects the next presentable show with output unchanged and revision bump; press 2 outputs its first slide with a transition; no next show means no change; next_show skips shows without slides and does not wrap.
    result: pass
    basis: static_review
    evidence:
      - "crates/core/src/engine.rs:461-473: setting check, `selected_show == next.show` -> go_to_index(index + 1) (play), otherwise select_show(next.show) (select)."
      - "crates/core/src/engine.rs:327-337 build_order emits only positions that have a slide, so an empty show is not a next_show target."
      - "crates/core/src/engine.rs:959-990 next_at_show_end_selects_then_plays asserts output unchanged, selected moved, revision +1, no transition; then output moved, revision +2, transition Some."
      - "crates/core/src/engine.rs:1009-1020 next_at_project_end_is_no_op asserts no change and no wrap."
      - "parity/reports/evidence/dev-015/outline-after-first-press-1280x820.png and outline-after-second-press-1280x820.png."
      - "parity/reports/reader/next-at-end-2026-11-09.md plus on-after-1-main/out and on-after-2-out captures."
    notes: "Skip-empty-show is statically true through build_order but is not exercised by a unit test with an empty show between two non-empty shows; see test_gaps."
  - id: B4
    requirement: setting off makes next at a show end a no-op (no selection, no output, false), including at the project end.
    result: pass
    basis: static_review
    evidence:
      - "crates/core/src/engine.rs:461-464 returns false before any selection change when the setting is off."
      - "crates/core/src/engine.rs:992-1007 next_at_show_end_setting_off_is_no_op asserts output, selection and revision unchanged."
      - "parity/reports/evidence/dev-015/outline-setting-off-next-noop-1280x820.png: rev 0, welcome-1, 1/2 after two Next presses."
    notes: "The project-end + setting-off combination shares the same early return; not separately asserted."
  - id: B5
    requirement: setting named next_item_on_last_slide, default true, persisted in the session, changing it does not move output or selection, engine exposes getter and setter returning whether changed without bumping the revision.
    result: pass
    basis: static_review
    evidence:
      - "crates/core/src/engine.rs:421-436 getter/setter; setter returns false when unchanged and does not touch index, selected_show or revision."
      - "crates/core/src/session.rs:38-48 serde default true and manual Default true; :376-401 old-session-default and round-trip tests."
      - "apps/desktop/src/runtime.rs:80-100 AppState::new applies the session value to the engine before the controller is built; :165-192 set_next_item_on_last_slide applies the engine and saves the same SessionStore."
      - "apps/desktop/src/runtime.rs:278 open_project uses replace_project_at, which does not reset the setting."
      - "parity/reports/evidence/dev-015/session-on.json and session-off.json show the field serialized true/false."
      - "parity/reports/evidence/dev-015/controller-at-end-off-after-restart-1280x820.png: At end: stop after a restart."
    notes: "The setter intentionally does not publish a RenderState revision; the controller repaints from its own signal, which is what the contract specifies."
  - id: B6
    requirement: "top-bar control next to Focus; labels At end: advance / At end: stop; clicking toggles; reflects persisted value after restart; applies immediately and saves; title/aria-label states the behaviour and current state."
    result: pass
    basis: static_review
    evidence:
      - "apps/desktop/src/app.rs:467-488 control is in topbar-actions immediately before Focus; class btn at-end on/off; title and aria_label from at_end_title; onclick toggles the local signal then calls AppState::set_next_item_on_last_slide."
      - "apps/desktop/src/app.rs:679-696 exact labels and title text; :814-824 unit test asserts both labels and the title phrase/current state."
      - "apps/desktop/src/app.rs:286-288 the signal is seeded from the engine, which AppState::new seeded from the session."
      - "parity/reports/evidence/dev-015/controller-at-end-on-1280x820.png (At end: advance) and controller-at-end-off-1280x820.png / controller-at-end-off-after-restart-1280x820.png (At end: stop)."
    notes: "The control keeps a local signal for immediate feedback; the evidence's off state was reached through the debug-only CJCRSG_DRAWER=at-end hook, which dispatches a real DOM click on `.btn.at-end` (app.rs:205), not by editing the session."
  - id: B7
    requirement: project outline marks the live show as current/live and the selected show distinctly as selected; when both are the same, live only.
    result: pass
    basis: static_review
    evidence:
      - "apps/desktop/src/drawer.rs:257-269 Live => outline-show current + badge `live`; else selected => outline-show selected + badge `selected`; `chosen = !live && selected == Some(index)`."
      - "apps/desktop/src/outline.rs:83-94 same logic in the standalone OutlinePanel; :163-180 same logic in FocusView with focus-show classes."
      - "apps/desktop/src/app.rs:339-345 passes live_show and selected_show into the drawer content; :513-515 into FocusView."
      - "parity/reports/evidence/dev-015/outline-after-first-press-1280x820.png: Welcome LIVE, Parity Fixture SELECTED, preview welcome-1."
      - "parity/reports/evidence/dev-015/outline-after-second-press-1280x820.png: Parity Fixture LIVE only, Welcome has no badge."
      - "parity/reports/evidence/dev-015/focus-after-first-press-1280x820.png: same markers in focus view."
    notes: "The contract's `outline-show current` / `outline-show selected` markup is present in the drawer's Shows tab, which is the controller's project outline."

claims:
  observed:
    - claim: "At a show's last slide, the first advance selects the next project item and leaves the output unchanged; the second advance outputs it (setting on)."
      label: observed
      source: "docs/freeshow-reference/show/presenting.md § End of show — observed; parity/reports/reader/next-at-end-2026-11-09.md"
      exercised_by: [next_at_show_end_selects_then_plays, reference-end-of-show-observed-2026-11-09]
      result: pass_static
    - claim: "With special.nextItemOnLastSlide off, neither the selection nor the output moves; at the end of the project nothing moves."
      label: observed
      source: "presenting.md § End of show — observed; § Spacebar item 5; reader report off run"
      exercised_by: [next_at_show_end_setting_off_is_no_op, next_at_project_end_is_no_op]
      result: pass_static
    - claim: "The setting is on in the default profile and can be switched off explicitly."
      label: observed
      source: "reader report profiles on/off; presenting.md § Settings (default claim itself is code)"
      exercised_by: [session-on.json, session-off.json, controller-at-end-on/off captures]
      result: pass_static
    - claim: "The reference's main-window header/selection moves to the next show on press 1 while the output window still shows the previous slide."
      label: observed
      source: "presenting.md § End of show — observed; reader captures"
      exercised_by: [outline-after-first-press-1280x820.png, reference on-after-1-main/out captures]
      result: pass_static
  code:
    - claim: "special.nextItemOnLastSlide is read at OutputHelper.ts:131; openProjectItem only sets activeShow; only playNext paths play the item directly (OutputHelper.ts:130-194, project.ts:35-64)."
      label: code
      status: recorded
      disposition: "Explains the observed two-step result; not a requirement on our engine. Not judged."
    - claim: "getNextSlide resolves the first outputtable entry and the disabled/binding skip rule (OutputHelper.ts:338-371, 414-425)."
      label: code
      status: not yet exercised
      disposition: |
        Our build_order includes disabled slides, so a show whose only slide is
        disabled would still be selected/played at a show end. The contract's B3
        only says "shows without slides", and disabled-slide navigation is a
        separate feature (show.slides.disabled), so this is not a DEV-015
        defect. A scenario that would test it: end of show A with show B whose
        only slide is disabled, then Next twice; the reference skips B, our
        engine currently would not.
    - claim: "The default is set at General.svelte:55 and only an explicit false disables it."
      label: code
      status: exercised_statically
      disposition: "Session default true, setter false check; old-session test. The observed on/off runs confirm the effect."
    - claim: "Next at a show end requires a next project item; there is no wrap (OutputHelper.ts:136-139, 255-264)."
      label: code
      status: exercised_statically
      disposition: "build_order + next_at_project_end_is_no_op. The 'skip shows without slides' part is statically true but not exercised by a dedicated test; see test_gaps."
  doc:
    - claim: "The online docs say space at the end 'will go to the next show'; the page's Doc vs code records that the docs do not mention the two-press behaviour."
      label: doc
      status: recorded_not_judged
      disposition: "Our implementation follows the observed two-step, not the doc."
  unknown:
    - claim: "Does the two-step rule generalise to a project with three or more shows?"
      label: unknown
      status: open_question
      disposition: "The contract fixes the generalisation (next show with at least one slide, no wrap). The reader report's open question remains open; the mechanism is in changeProjectItem, but no 3-show run was made."
    - claim: "What does the operator see in the output between press 1 and press 2?"
      label: unknown
      status: open_question
      disposition: "The reader captures show the output stays on the previous show. The contract adopts that; our evidence's /api/state and preview stay on welcome-1."
    - claim: "Does the setting affect the active selection or only the output?"
      label: unknown
      status: open_question
      disposition: "The reader off run shows neither moves; the contract adopts that (B4)."

