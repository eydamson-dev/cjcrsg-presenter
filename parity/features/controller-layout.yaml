# Controller layout: bottom drawer, left project browser, top bar

Features read from FreeShow `ff784eb` (1.6.8-beta.3). This file answers
DEV-013's question "what does the reference's controller shell actually do?"
and nothing else: it does not decide what we build.

## How to read the labels

Every entry carries a `label` and a `confidence`:

- `label: observed` — the behaviour is stated literally at the cited
  file:line. Read from source, not executed: no FreeShow window was driven for
  this pass, because this session runs headless and may only read the checkout.
- `label: inferred` — the behaviour follows from combining several citations or
  from runtime event ordering that was not executed. Confirm before it becomes
  a required parity behaviour (D13).
- `label: unknown` — not established.

`confidence` keeps the workflow's enum: `high` for observed source, `medium`
for inference, `low` for anything a human must confirm.

`area: controller` is outside the current `docs/parity-workflow.md` §3.1 enum
(navigation | outputs | rendering | media | remote | stage | editing | import).
It is used here because the controller shell is its own surface; the enum should
gain the value rather than these entries pretending to be "editing".

