id: ui.drawer.drag.resize
area: controller
title: Dragging the strip resizes the drawer, above a threshold
ui: true
reference:
  commit: ff784eb388c7baef60d67e6d4e7c504f4322bca3
  evidence:
    - src/frontend/components/drawer/Drawer.svelte:35-46
    - src/frontend/components/drawer/Drawer.svelte:52-78
    - src/frontend/components/drawer/Drawer.svelte:355-363
  read_by: reader
label: observed
confidence: high
scenarios: []
status: planned
deviations: []
notes: >
  The visible handle is a 4 px bar: .top::after, top: 0, height: 4px,
  background var(--primary-lighter), cursor ns-resize. It is decoration: the
  mousedown listener is on the whole 40 px .top element and only skips clicks
  whose target is inside .search, so dragging anywhere on the strip resizes.
  New height = window.innerHeight - clientY - offsetY, where
  offsetY = innerHeight - height - clientY at mousedown; the value is clamped
  to [40, maxHeight]. The move flag is set whenever the drag produces a height
  inside the clamp, which is what stops the same gesture from also counting as
  a click.
  Side effect: mousemove clears the current selection
  (selected.set({ id: null, data: [] })) on the first move of a drag.
```

