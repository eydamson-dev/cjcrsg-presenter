```yaml
id: media.controls
area: media
title: "The media control strip: reveal, play/pause, loop, mute, lock"
ui: true
reference:
  commit: ff784eb388c7baef60d67e6d4e7c504f4322bca3
  evidence:
    - src/frontend/components/output/tools/MediaControls.svelte:38-191
    - src/frontend/components/output/preview/Preview.svelte:278-282
    - src/frontend/components/media/Video.svelte:263
  read_by: reader
label: observed
confidence: medium
scenarios: []
status: planned
deviations: []
notes: >
  Observed (media-behaviour, 2026-11-12): the strip renders in the clear-control
  column only while the Background layer is the revealed one (Preview.svelte:
  278-282); the 05-start step revealed it, and 06 records it present with that
  layer selected. The reveal control is the Background layer's disclosure
  button, next to "Clear background [F1]" - this answers the page's former
  unknown. With a video background the strip showed name + Play/Pause + "Go forward 10 seconds"
  + loop + mute; with an image background it showed the name only (no buttons);
  with no background it was absent (06, 11, 13). Play/pause drove the live
  player (07); loop and mute changed the player while the stored show media
  entry still read loop:true/muted:true (08); locking disabled play/pause and
  mute but not loop, and unlocking restored them (09, 10).
  Source fact settled by the run: muted is not DOM-readable - the output <video>
  is hardcoded muted (media/Video.svelte:263) and video.muted was true even when
  the strip offered Mute; read mute state from the strip's button title. loop is
  DOM-readable.
  Boundary: the seek slider's currentTime/duration tracking, clicking the +-10 s
  buttons and their clamps, the media-name preview button and the videoSync
  subscription stay code.
```

