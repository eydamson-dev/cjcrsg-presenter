# Media: drawer click/clear, backgrounds, video controls, next on media finished

Features read from FreeShow `ff784eb` (1.6.8-beta.3), plus the `media-behaviour`
run of 2026-11-12. Labels follow `docs/freeshow-reference/USING-THIS.md`:
`label: observed` means a recorded run at the pin, `code` means read from the
pinned source only.

Run evidence for every `observed` note below:
- `parity/reports/evidence/observe-media-2026-11-12-xvfb/` — scenario
  `media-behaviour`, 14/14 steps, `failed: []`, one normal output (`default`),
  xvfb-run virtual display (`:99`, 1920×1080), controller viewport 1600×900.
  Show `Parity With Media`: layout slide `fx-1` seeded with background `m-bg`
  (`{loop:true, muted:true}`) and `actions.nextAfterMedia:true`; media folder
  `/tmp/opencode/media` with `video-bg.webm` (VP9+Opus, 3.008 s) and `logo.png`.
  The output window was created hidden and every output page screenshot timed
  out on llvmpipe; evidence is the output DOM/player state
  (`outputs[]` → `videos[]`, `images[]`) plus the media strip read from the
  controller, not an output PNG.

---

