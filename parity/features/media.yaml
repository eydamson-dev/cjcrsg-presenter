id: media.next-finished
area: media
title: A slide's media reaching its end advances, even when the media loops
ui: true
reference:
  commit: ff784eb388c7baef60d67e6d4e7c504f4322bca3
  evidence:
    - src/frontend/components/media/video/videoPlayer.ts:344-428
    - src/frontend/components/helpers/showActions.ts:676-728
    - src/frontend/components/slide/Actions.svelte:132
    - src/frontend/components/context/loadItems.ts:189
  read_by: reader
label: observed
confidence: medium
scenarios: []
status: planned
deviations: []
notes: >
  Observed (media-behaviour, 2026-11-12): with actions.nextAfterMedia seeded on
  layout slide fx-1 and a background looping at the start of the step
  (video.loop === true), the output advanced from slide 1 to slide 2 exactly
  once when the clip ended, left the first slide and did not reach slide 3
  (11-media-next-finished.json). Playback began at 1.392 s of the 3.008 s clip
  (1616 ms remaining) and the advance was observed 2794 ms later, inside the
  run's window around that remaining time - tied to the clip, not a fixed wait.
  The video background was gone afterwards and the advance target's own logo.png
  background rendered. That observes the ordering claim (the end check runs
  before the loop branch) for a looping background; whether the first or the
  repeated check fired was not isolated, and the 600 ms second-advance guard is
  only indirectly observed (one advance). Boundary: a non-looping background
  without the flag (the 200 ms clear), the audio/timer reuse and a foreground
  video with the flag stay code/unknown.
```
