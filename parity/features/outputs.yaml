# Outputs: present, window visibility, lock, clear, styles

Features read from FreeShow `ff784eb` (1.6.8-beta.3), plus the `outputs-basic`
run of 2026-11-11, the `stage-multi-output` run of 2026-11-12 and the
`styles-multi-output` run of 2026-11-12. Labels follow
`docs/freeshow-reference/USING-THIS.md`: `label: observed` means a recorded run
at the pin, `code` means read from the pinned source only.

Run evidence for every `observed` note below:
- `parity/reports/evidence/observe-outputs-2026-11-11-workspace/` — scenario
  `outputs-basic`, 11/11 steps, 21 screenshots, one 1920×1080 display, hidden X11
  workspace, show `Parity Fixture` (3 slides, no media). The Wayland/RTX 5060 Ti
  run (`...-host/`) recorded the same present-time window state but no output
  frames; do not use it for frame claims.
- `parity/reports/evidence/observe-stage-multi-output-2026-11-12-workspace/` —
  scenario `stage-multi-output`, 14/14 steps, one 1920×1080 display, hidden X11
  workspace. Two normal outputs (`Primary`, `Secondary`) and one stage output
  (`Parity Stage`), one stage layout with two `slide_text` items. Output content
  is DOM text (`outputs[]`), not output PNGs (the output windows were created
  hidden and their page screenshots timed out on llvmpipe).
- `parity/reports/evidence/observe-styles-multi-output-2026-11-12-xvfb/` —
  scenario `styles-multi-output`, 10/10 steps, `failed: []`, one 1920×1080
  virtual display. Three normal outputs sharing one show, each bound to a style
  seeded in `settings_synced.json`: `Primary` `lines:2`, `Secondary`
  `aspectRatio 4:3`, `Tertiary` `layers:["slide","overlays"]`. Evidence is the
  per-output DOM/geometry state (`text`, `lines`, `contentBox`, `images[]`) plus
  four output PNGs (steps 07–10, primary only).

