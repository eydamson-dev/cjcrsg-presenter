  state-dependent toggle (helpers/output.ts:129) and outputDisplay comes from the
  windows' reported visibility (receivers.ts:119-124), so a hidden output leaves
  it off. The page is still real: it renders and advances. Boundary: the
  two-click stop, Ctrl/Cmd-click force-stop, Ctrl+O, and per-output enabled:false
