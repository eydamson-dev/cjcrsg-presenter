# Outputs: present, window visibility, lock, clear

Features read from FreeShow `ff784eb` (1.6.8-beta.3), plus the `outputs-basic`
run of 2026-11-11. Labels follow `docs/freeshow-reference/USING-THIS.md`:
`label: observed` means a recorded run at the pin, `code` means read from the
pinned source only.

Run evidence for every `observed` note below:
`parity/reports/evidence/observe-outputs-2026-11-11-workspace/` — scenario
`outputs-basic`, 11/11 steps, 21 screenshots, one 1920×1080 display, hidden X11
workspace, show `Parity Fixture` (3 slides, no media). The Wayland/RTX 5060 Ti
run (`...-host/`) recorded the same present-time window state but no output
frames; do not use it for frame claims.

---

```yaml
id: out.window
area: outputs
title: Present creates an output page that can stay hidden while the output runs
ui: true
reference:
  commit: ff784eb388c7baef60d67e6d4e7c504f4322bca3
  evidence:
    - src/electron/output/helpers/OutputLifecycle.ts:251-291
    - src/electron/output/helpers/OutputVisibility.ts:33-74
    - src/frontend/MainOutput.svelte:122-147
  read_by: reader
label: observed
confidence: high
scenarios: []
status: planned
deviations: []
notes: >
  Observed: a Present click created a second page with root class
  "fill context #output_window" in a window titled "Primary". On one display the
  window's isVisible() was false in every step, before and after starting the
  show, while the output page rendered, advanced, locked and cleared. The
  two-display GPU desktop also recorded "Primary" visible:false at present.
  Mechanism: createOutputWindow builds the BrowserWindow with show:false
  (OutputLifecycle.ts:251-291); toggleOutput hides instead of showing when the
  output's bounds cover more than half the main window, bounds are not locked,
  and it is auto-positioned, auto-started, or always-on-top (the default)
  (OutputVisibility.ts:58-72; helpers/output.ts:129-133). Boundary: second
  display, multiple outputs, per-output styles, and any mapped output frame are
  not covered by the run.
```

