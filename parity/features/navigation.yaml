# Navigation

Features read from FreeShow `ff784eb`. Each entry names the file it was read
from and how confident that reading is. `confidence: low` means a human should
confirm before implementation.

---

```yaml
id: nav.next.controller
area: navigation
title: Advance one slide from the controller
ui: true
reference:
  commit: ff784eb388c7baef60d67e6d4e7c504f4322bca3
  evidence:
    - src/server/controller/App.svelte:111-112
    - src/server/controller/App.svelte:146-150
  confidence: high
scenarios: [nav-next-basic]
status: partial
deviations: [DEV-001]
notes: >
  The controller emits { channel: "ACTION", data: { id: "next" } } over Socket.IO
  and also maps Space, ArrowRight and PageDown to the same action.
```

