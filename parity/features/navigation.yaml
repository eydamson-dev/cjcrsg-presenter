```yaml
id: nav.bounds.next-at-end
area: navigation
title: Next on the last slide does not wrap
ui: false
reference:
  commit: ff784eb388c7baef60d67e6d4e7c504f4322bca3
  evidence: []
  confidence: low
scenarios: [nav-next-edge-cases]
status: planned
deviations: []
notes: >
  Unverified in the reference. Our engine currently ignores next at the end
  (crates/core/src/engine.rs). The reference may instead advance to the next
  group or stop the show. This is the first behaviour to confirm, because both
  answers are plausible and they feel different in a service.
```

## Deviations

```yaml
# parity/deviations.yaml
DEV-001:
  title: Keyboard shortcuts not implemented
  detail: >
    FreeShow's controller accepts Space/ArrowRight/PageDown and
    ArrowLeft/PageUp. The Rust controller does not exist yet.
  accepted: true
  reason: Deferred until the controller client is built (Phase 2).
  owner: implementation
```
