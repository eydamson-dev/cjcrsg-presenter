`nav-disabled-slides` run of 2026-11-12. Labels follow
`docs/freeshow-reference/USING-THIS.md`: `label: observed` means a recorded run
at the pin, `code` means read from the pinned source only. The behaviour page is
`docs/freeshow-reference/show/presenting.md` ("Disabled slides").

Run evidence for the `observed` note below:
- `parity/reports/evidence/observe-nav-disabled-slides-2026-11-12-xvfb/` —
