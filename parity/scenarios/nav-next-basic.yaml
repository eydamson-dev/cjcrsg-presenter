# Navigation — next and previous

The smallest end-to-end slice. Runs against both adapters; the reference has
been exercised, the Rust adapter has not.

```yaml
id: nav-next-basic
feature: [nav.next.controller, nav.previous.controller]
fixture: fixtures/parity-three-slides.show   # FreeShow format, imported for the Rust side
viewports: ["1920x1080", "1366x768", "1080x1920"]
steps:
  - open_project: Parity Project
  - open_show: Parity Fixture
  - expect:
      slide_index: 0
      text_contains: "Verse one, line one"
  - action: next
  - expect:
      slide_index: 1
      text_contains: "Verse one, line three"
  - action: next
  - expect:
      slide_index: 2
      text_contains: "Verse two, line one"
  - action: previous
  - expect:
      slide_index: 1
      text_contains: "Verse one, line three"
  - snapshot: nav-after-previous
```

```yaml
id: nav-next-edge-cases
feature: [nav.bounds.next-at-end]
fixture: fixtures/parity-three-slides.show
viewports: ["1920x1080"]
steps:
  - open_project: Parity Project
  - open_show: Parity Fixture
  - action: goto
    index: 2
  - action: next
  - expect:
      # Deliberately unresolved: the reference behaviour is unverified.
      # Record what FreeShow does here, then tighten this assertion.
      recorded: next-at-end
  - action: previous
  - expect:
      slide_index: 1
```

## Notes

- `fixtures/parity-three-slides.show` is the fixture already used in the
  preflight: three slides, one layout, one group. It must be committed in
  FreeShow's `[id, show]` format, which is what the importer reads.
- `recorded:` captures behaviour when the expectation is not yet known. It is
  not a pass: the scenario stays `partial` until a real expectation replaces it.
- `slide_index` is 0-based and counts slides across the whole show, which is
  how both implementations address them.
