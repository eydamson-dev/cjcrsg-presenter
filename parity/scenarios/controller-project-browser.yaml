## Coverage map

| Contract | Scenarios |
| --- | --- |
| P1 panel, row order, open once, ten-entry cap | `controller-project-browser-list`, `controller-project-browser-empty` |
| P1 width unchanged and persisted | `controller-project-browser-width` |
| P2 row fields, `current` badge, 4 px border, missing and disabled | `controller-project-browser-row` |
| P2 render-time missing detection and recovery | `controller-project-browser-missing-recover` |
| P3 open a non-current row, current-row no-op, failed open | `controller-project-browser-open` |
| P4 forget one, never the open, file untouched, no dialog, re-open restores | `controller-project-browser-forget` |
| P4 last entry leaves the empty state | `controller-project-browser-forget-last` |
| P5 the two empty states | `controller-project-browser-empty`, `controller-project-browser-forget`, `controller-project-browser-forget-last` |
| P6 outline in the drawer's Shows tab, left column without it | `controller-project-browser-outline` |
| P6 focus mode unchanged | `controller-project-browser-focus` |
| P7 Make portable in the foot, success/error text, no-file message | `controller-project-browser-portable` |
| P8 consumer, published state after an open | `controller-project-browser-consumer`, `render_state_unchanged` in `controller-project-browser-open` |

## Notes and unresolved clauses

- **No controller adapter.** Every scenario here is manual until a harness can
  drive the controller WebView. The environment and computed-style steps are
  marked `# CAPABILITY:` and must fail loudly, not skip.
- **P5 and the built-in demo.** The app always has a project loaded: with an
  empty session it is the built-in demo, which has no file. The contract does
  not say whether that demo counts as "an open project" for P1/P5. If it did,
  the "no recent projects" sentence could never appear, because the demo is
  always present. These scenarios therefore treat "the open project" as a
  **file-backed** project: the demo is not a row and does not suppress the
  empty state. The contract needs a sentence either way; if the demo is meant
  to be a row, `controller-project-browser-empty` and `-forget-last` need
  rewriting.
- **P4's last entry.** With an open project, the open row has no Forget control,
  so the panel cannot be emptied from that state; P5 says it shows just the
  open project. The only reachable "last entry" path is a session whose newest
  entry cannot be read, so startup falls back to the demo and every remaining
  row is forgettable. `controller-project-browser-forget-last` uses that path.
  This is a consequence of P4 + P5, not an extra rule, but it is worth a
  contract sentence.
- **P3 failed-open trigger.** The scenario uses a readable `.cjcp` whose
  `format_version` is newer than the build supports: the row is not `missing`,
  the open is refused, and the inline error appears. If "cannot be read" in P2
  is intended to include a file that is present but cannot be parsed, that row
  would be `missing` and disabled, and P3's failed-open path would need a
  different deterministic trigger (for example a file deleted between render
  and click). A present but permission-denied file is not separately tested;
  the same ambiguity applies. The contract should say which check decides
  `missing`.
- **P1 `open_project` and the session.** In normal use the open project is also
  the session's newest entry, so "open first" and "newest first" agree; the
  scenario checks the part that can diverge — the open project appears once,
  never twice. Normal operation cannot produce an open project lower than first
  in the session: startup restores the first entry, and opening records at the
  front. A state where the open project is not in the session at all (for
  example, a session write that failed) is not exercised and would need its own
  scenario.
- **P1 ten-entry cap.** The session truncates at `MAX_RECENT` (10) when an
  eleventh project is opened. `controller-project-browser-list` checks the
  panel side; the session-side unit test (`the_list_is_capped`) and acceptance
  criterion 2 cover the storage rule. The seeded ten entries use distinct paths
  and the display names in the fixtures table below.
- **Width has no empty state.** The left column always has a width; the lower
  boundary is 200 px and the fresh default is 280 px. The width scenario covers
  normal use, both clamps, persistence on release and a restart; there is no
  zero or empty case to test.
- **P6 and drawer contract B7.** `docs/contracts/ui-drawer.md` B7 describes the
  Shows tab as one row per show with the name and slide count. P6 replaces that
  content with the project outline (sections as headings, shows with the live
  marker and Play). Slide counts are therefore not asserted in either
  direction; B7 should be marked superseded by P6.
- **P4 "small" Forget control.** The contract calls the control small but gives
  no size or target. Only its presence or absence on a row is asserted; no
  computed size is checked.
- **P3 media allowlist.** The open path also updates the media allowlist, which
  is not observable from the controller UI. The open scenario checks the outline,
  media list and session; the allowlist itself stays with the media-server tests
  and the existing open path.
- **P6 "full-window list in the centre".** The measured controller puts the
  focus list in the centre column and keeps the top bar, left column and right
  column (`parity/reports/ui-shell-2026-11-09.md`). P6 says focus mode is
  unchanged, so `controller-project-browser-focus` asserts that measured
  behaviour. If "full-window" means the list covers the whole window, that is a
  change, not "unchanged", and the contract should say so.
- **P7 error text.** P7 says "the same success and error text as today". The
  success text is today's `copied N[, missing N][, failed N]`; the error text is
  today's `cannot read <path>` / `cannot write <path>` (plus the OS message),
  and the no-file foot text is today's `Not saved to a file yet.`. The exact OS
  suffix is not asserted. If P7 meant a different string, name it in the
  contract.
- **P7 no-file case.** The foot has no Make portable control when the project
  has no file, so only the message is asserted. The separate action error
  `This project has not been saved to a file yet.` is unreachable through the
  visible control and is not exercised.
- **P8 remote and media allowlist.** Neither is observable from the controller
  WebView. The remote, media serving and output recovery stay with their
  existing scenarios and tests; this file checks the published state and the
  drawer's media list. "No engine or output change" is a code and architecture
  claim, verified by review and the engine tests, not by a UI scenario.
- **P8 render state wording.** The contract says "no change to render state".
  The browser itself changes the render state only by opening a project, and
  that must publish the new project's first show and slide through the existing
  open path. The scenario asserts exactly that, then asserts that further
  browsing leaves the published state alone. If "no change" was meant to cover
  the open itself, it conflicts with P3, which says the engine follows the new
  project.
- **P8 measured behaviours.** Recovery, transitions and media playback are
  measured by their own reports and scenarios; opening a project through the
  browser uses the same open path as the CLI Open, so this file does not repeat
  those runs. Acceptance criteria 2 and 6 and the existing evidence cover them.
- **Row metadata and visual claims.** The muted path, the 4 px accent border,
  the badge text, the error's position under the list, section headings, and
  the foot living in the Projects panel are computed-style or DOM-structural
  checks, marked `# CAPABILITY:` inline. A capture at 1280×800 (acceptance
  criterion 3) is the visual evidence, not a substitute for these state checks.
- **Reference recent-list rules not asserted.** FreeShow shows its recent list
  only when at least two unarchived projects were used in five days, newest
  first, under a "Recently used" heading (`ui.projects.recent`). The contract
  deliberately replaces that with the open project plus the session's list, so
  the five-day rule, the "Recently used" heading, the folder tree, archived
  projects and provider icons are out of scope and are not asserted.
- **Reference open gestures not asserted.** FreeShow opens a project and its
  first item on click, Alt-click opens without the first item, and Ctrl-click
  is ignored (`ui.projects.row`). P3 names only the plain open; the modifier
  gestures are not in this milestone and are not tested.
- **Feature-inventory gap.** The inventory has entries for the project tree,
  row, actions and recent list, but not for this milestone's Projects panel,
  its foot, the outline-in-Shows content or focus mode. These scenarios link to
  the nearest entries; the inventory should gain entries for the new surfaces.
- **Fixture dependency.** Row names, section names and media rows are tied to
  the proposed fixtures below. A different fixture changes those literals, not
  the contract.

