# Controller project browser — parity scenarios (DEV-013 milestone 7)
#
# Contract: docs/contracts/ui-project-browser.md, behaviours P1–P8.
# Reference evidence: parity/features/controller-layout.yaml (`ui.projects.*`)
#   and parity/reports/reader/controller-layout-2026-11-09.md §2.
# Reference commit: ff784eb388c7baef60d67e6d4e7c504f4322bca3 (1.6.8-beta.3).
#
# ## Harness status — read this first
#
# There is still no controller adapter. The controller is a **native WebView
# window**, and `parity/adapters/` cannot drive it (`docs/parity-workflow.md`
# §3.3, D13). No scenario in this file can be executed by `parity run` today.
#
# They are written so that:
#
#   1. an operator can run them by hand against the real controller
#      (`GDK_BACKEND=x11 cargo run -p cjcrsg-presenter`, copies of the fixtures
#      from `parity/fixtures/`), and
#   2. a future Electron/Playwright adapter — or a DOM harness over a web build
#      of the controller — can execute them unchanged.
#
# Steps that need a capability the current harness lacks are marked
# `# CAPABILITY:` inline. They are **not passes**: an adapter that cannot
# perform a step must fail loudly, never skip it (§3.2).
#
# ## Conventions
#
# - Actions are operator intent, never selectors or coordinates. The adapter
#   maps them to the UI.
# - `viewports` are the WebView **content box** (`innerWidth` × `innerHeight`).
#   `1280x800` means `innerHeight == 800`; the same size as the drawer
#   scenarios and the acceptance capture.
# - `project` is the **file-backed** project the browser treats as open; `null`
#   while the app is on its built-in demo. The demo has no path and is not a
#   project-browser row (see the notes on P5).
# - `left_column.projects` is `{row_count, empty, empty_text, rows}`.
#   `rows` is the displayed order. A row is `{name, path_suffix, current,
#   current_badge, missing, missing_text, open_disabled, forget,
#   accent_border_px, path_muted, fields, extra_fields}`. `forget` is whether
#   the Forget control exists; `open_disabled` is whether the row's open action
#   is disabled.
# - `left_column.foot` is the project browser's foot:
#   `{panel, path_suffix, portable, text, status}`. `panel` is the panel it
#   belongs to, `portable` is whether Make portable exists, `text` is the
#   no-file message, and `status` is Make portable's result text.
#   `status_contains` and `status_contains_path` are substring checks on that
#   text when the wording around a path or OS error is not fixed.
# - `left_column.outline_present` is whether the old project outline is still
#   rendered in the left column (P6 says it is not).
# - `left_column.width`, `width_min`, `width_max` and `resizable` are the
#   rendered left column and its drag limits.
# - `session.recent` is the session's stored recent list, newest first, by
#   project name. `session.left_width` is the persisted left column width.
# - `drawer`, `content` and `play_show` keep the meaning and shape given in
#   `controller-drawer.yaml`. `content.items` is an ordered list of
#   `{kind: section|show, name, live}` and is where the project outline now
#   lives (P6); `content.row_count` counts show rows, `content.play_controls`
#   counts Play controls, and `content.sections_are_headings` is the structural
#   claim that sections render as headings.
# - `focus_view` is `{present, placement, items, live_show, readout,
#   exit_control}` for focus mode. `placement` is `centre`; `readout` is
#   `{slide_id, position, total}`. `top_bar.present`, `right_column.present`
#   and `preview_present` record what stays and what is replaced.
# - `render_state` is the published state after an open:
#   `{project, show, slide_id, position, total}`. `render_state_unchanged: true`
#   compares the published render state (active project, live show, slide
#   content, outputs) with the previous expect, ignoring revision numbers.
# - `unchanged_since: <snapshot>` compares the project browser, session, foot,
#   project and live show with a named snapshot, ignoring the clock.
# - `error` is the inline open error:
#   `{present, inline, position, text_nonempty}`; `position: below_list` means
#   it is rendered under the list, not inside a row.
# - `files` reports whether a fixture's file exists on disk:
#   `{present: true|false}`. `confirmation_shown` reports any confirmation
#   dialog.
# - `start_session: fresh` prepares an empty session directory
#   (`CJCRSG_DATA_DIR`) for the next launch: no recents, no remembered width.
#   It does not launch the app; `launch_app` or `open_project` does.
# - `set_session_value` names a semantic session field; `recent` takes an
#   ordered list of project names, newest first, and is written before the next
#   launch. The adapter resolves each name to its fixture's absolute path; the
#   session stores absolute paths and orders by list position (`opened_at` is
#   informational only).
# - Every run works on **copies** of the fixtures under a scratch root.
#   `delete_project_file`, `restore_project_file`, `make_read_only` and
#   `restore_write_permission` act on those copies, never on the repository.
# - `wait_for_render` yields until the controller has rendered again; a manual
#   run waits a moment. It is not a substitute for a user action and must not
#   switch tabs to force a render.
# - `open_project <name>` ensures that project is open (a launch when the app
#   is not running, a CLI open when it is) and records it as recent. It is
#   setup, never the UI action under test; opening from the browser uses
#   `click_project_row`.
#
# ## Semantic actions used here
#
#   click_project_row <name>   activate a project row's open action
#   forget_project <name>      activate that row's Forget control
#   drag_column {side, to_width, grab}   press, move to the width, hold
#     grab: handle | column_edge (defaults to handle)
#   release_drag               release a held column drag
#   make_portable              activate the foot's Make portable control
#   enter_focus / exit_focus   the top bar's Focus control
#   select_tab <id>            single click on a drawer tab
#   play_show <name>           activate the Play control on an outline row
#
#   Environment setup (all CAPABILITY: the harness has no session, lifecycle or
#   filesystem control today):
#   start_session: fresh · quit_app · launch_app · restart_app
#   set_session_value {name, value} · delete_project_file · restore_project_file
#   make_read_only · restore_write_permission · wait_for_render
#
# ---------------------------------------------------------------------------

# P1 composition: the open project first, then the other recents newest first,
# the open project exactly once, and the panel shows all ten entries the
# session keeps. An eleventh open tests the MAX_RECENT cap from the panel side:
# the oldest entry is dropped and the panel still shows ten.
#
# Lower boundaries (one row, zero rows) are in `controller-project-browser-empty`
# and `-forget-last`; an empty list is not reachable here by construction.

```yaml
id: controller-project-browser-list
feature: [ui.projects.recent, ui.projects.tree]
contract: [ui-project-browser/P1]
fixture: fixtures/controller-project-browser-main.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - action: set_session_value        # CAPABILITY: session seed
    name: recent
    value:
      - Browser G
      - Browser F
      - Browser E
      - Browser D
      - Browser C
      - Browser B
      - Browser A
      - Browser Third
      - Browser Second
      - Browser Main
  - action: launch_app               # CAPABILITY: lifecycle control
  - expect:
      app: { running: true }
      project: Browser G             # the newest recent is restored
      left_column:
        heading: "Projects"
        panels: ["Projects"]
        projects:
          row_count: 10              # the panel shows every kept entry
          empty: false
          rows:
            - { name: "Browser G", current: true, missing: false }
            - { name: "Browser F", current: false, missing: false }
            - { name: "Browser E", current: false, missing: false }
            - { name: "Browser D", current: false, missing: false }
            - { name: "Browser C", current: false, missing: false }
            - { name: "Browser B", current: false, missing: false }
            - { name: "Browser A", current: false, missing: false }
            - { name: "Browser Third", current: false, missing: false }
            - { name: "Browser Second", current: false, missing: false }
            - { name: "Browser Main", current: false, missing: false }
      session:
        recent:
          - Browser G
          - Browser F
          - Browser E
          - Browser D
          - Browser C
          - Browser B
          - Browser A
          - Browser Third
          - Browser Second
          - Browser Main
  - snapshot: browser-list-seeded
  - action: click_project_row
    project: Browser D             # opening an older entry refreshes it to front
  - expect:
      project: Browser D
      left_column:
        projects:
          row_count: 10
          rows:
            - { name: "Browser D", current: true, missing: false }
            - { name: "Browser G", current: false, missing: false }
            - { name: "Browser F", current: false, missing: false }
            - { name: "Browser E", current: false, missing: false }
            - { name: "Browser C", current: false, missing: false }
            - { name: "Browser B", current: false, missing: false }
            - { name: "Browser A", current: false, missing: false }
            - { name: "Browser Third", current: false, missing: false }
            - { name: "Browser Second", current: false, missing: false }
            - { name: "Browser Main", current: false, missing: false }
      session:
        recent:
          - Browser D
          - Browser G
          - Browser F
          - Browser E
          - Browser C
          - Browser B
          - Browser A
          - Browser Third
          - Browser Second
          - Browser Main
  - action: click_project_row
    project: Browser G             # reversal: the first entry opens again
  - expect:
      project: Browser G
      left_column:
        projects:
          row_count: 10
          rows:
            - { name: "Browser G", current: true, missing: false }
            - { name: "Browser D", current: false, missing: false }
            - { name: "Browser F", current: false, missing: false }
            - { name: "Browser E", current: false, missing: false }
            - { name: "Browser C", current: false, missing: false }
            - { name: "Browser B", current: false, missing: false }
            - { name: "Browser A", current: false, missing: false }
            - { name: "Browser Third", current: false, missing: false }
            - { name: "Browser Second", current: false, missing: false }
            - { name: "Browser Main", current: false, missing: false }
      session:
        recent:
          - Browser G
          - Browser D
          - Browser F
          - Browser E
          - Browser C
          - Browser B
          - Browser A
          - Browser Third
          - Browser Second
          - Browser Main
  - action: quit_app                 # CAPABILITY: lifecycle control
  - open_project: Browser H          # an eleventh project records and truncates
  - expect:
      project: Browser H
      left_column:
        projects:
          row_count: 10              # MAX_RECENT, not eleven
          rows:
            - { name: "Browser H", current: true, missing: false }
            - { name: "Browser G", current: false, missing: false }
            - { name: "Browser D", current: false, missing: false }
            - { name: "Browser F", current: false, missing: false }
            - { name: "Browser E", current: false, missing: false }
            - { name: "Browser C", current: false, missing: false }
            - { name: "Browser B", current: false, missing: false }
            - { name: "Browser A", current: false, missing: false }
            - { name: "Browser Third", current: false, missing: false }
            - { name: "Browser Second", current: false, missing: false }
      session:
        recent:
          - Browser H
          - Browser G
          - Browser D
          - Browser F
          - Browser E
          - Browser C
          - Browser B
          - Browser A
          - Browser Third
          - Browser Second
      # Browser Main was the oldest and is gone.
  - snapshot: browser-list-cap
```

# P2 row anatomy: name, muted path, the `current` badge, the 4 px accent left
# border, the `missing` flag with a disabled open action, Forget only on the
# non-open rows, and no other metadata. Clicking a missing row's disabled open
# action does nothing.
#
# The path is asserted by suffix, not as an absolute literal: the session stores
# absolute paths, which differ per machine.

```yaml
id: controller-project-browser-row
feature: [ui.projects.row]
contract: [ui-project-browser/P2, ui-project-browser/P4]
fixture: fixtures/controller-project-browser-main.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - action: delete_project_file       # CAPABILITY: filesystem control
    project: Browser C
  - action: set_session_value         # CAPABILITY: session seed
    name: recent
    value: [Browser Main, Browser Second, Browser C]
  - action: launch_app                # CAPABILITY: lifecycle control
  - expect:
      app: { running: true }
      project: Browser Main
      left_column:
        heading: "Projects"
        panels: ["Projects"]
        projects:
          row_count: 3
          empty: false
          rows:
            - name: Browser Main
              path_suffix: controller-project-browser-main.cjcp
              path_muted: true          # CAPABILITY: computed style
              current: true
              current_badge: "current"
              accent_border_px: 4       # CAPABILITY: computed style (reference: 4 px)
              missing: false
              missing_text: null
              open_disabled: false
              forget: false             # P4: the open project has no Forget
              fields: [name, path]      # CAPABILITY: DOM structural
              extra_fields: []          # no dates, sizes or slide counts
            - name: Browser Second
              path_suffix: controller-project-browser-second.cjcp
              path_muted: true
              current: false
              current_badge: null
              accent_border_px: 0
              missing: false
              missing_text: null
              open_disabled: false
              forget: true
              fields: [name, path]
              extra_fields: []
            - name: Browser C
              path_suffix: controller-project-browser-c.cjcp
              path_muted: true
              current: false
              current_badge: null
              accent_border_px: 0
              missing: true
              missing_text: "missing"
              open_disabled: true       # P2: a missing row cannot be opened
              forget: true
              fields: [name, path]
              extra_fields: []
        foot:
          path_suffix: controller-project-browser-main.cjcp
          portable: true
      session:
        recent: [Browser Main, Browser Second, Browser C]
  - snapshot: browser-rows
  - action: click_project_row
    project: Browser C              # disabled: a click must be a no-op
  - expect:
      unchanged_since: browser-rows
      error: { present: false }
```

# P2 render-time missing detection, in both directions. A file deleted before
# launch is flagged; restoring it makes the row openable again without a
# restart; deleting a file while the app runs flags that row; restoring it
# again clears the flag. The open action works after each restoration.
#
# `wait_for_render` is the step that lets the panel render again. It is not a
# restart: the contract's promise is that the check runs at render time.

```yaml
id: controller-project-browser-missing-recover
feature: [ui.projects.row]
contract: [ui-project-browser/P2]
fixture: fixtures/controller-project-browser-main.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - action: delete_project_file       # CAPABILITY: filesystem control
    project: Browser Second
  - action: set_session_value         # CAPABILITY: session seed
    name: recent
    value: [Browser Main, Browser Second]
  - action: launch_app                # CAPABILITY: lifecycle control
  - expect:
      project: Browser Main
      left_column:
        projects:
          row_count: 2
          rows:
            - { name: "Browser Main", current: true, missing: false, open_disabled: false }
            - { name: "Browser Second", current: false, missing: true, open_disabled: true, forget: true }
  - action: restore_project_file      # CAPABILITY: filesystem control
    project: Browser Second
  - action: wait_for_render           # CAPABILITY: render tick
  - expect:
      left_column:
        projects:
          rows:
            - { name: "Browser Main", current: true, missing: false, open_disabled: false }
            - { name: "Browser Second", current: false, missing: false, open_disabled: false, forget: true }
  - action: click_project_row
    project: Browser Second           # restored without a restart: it opens
  - expect:
      project: Browser Second
      left_column:
        projects:
          row_count: 2
          rows:
            - { name: "Browser Second", current: true, missing: false, open_disabled: false, forget: false }
            - { name: "Browser Main", current: false, missing: false, open_disabled: false, forget: true }
      session:
        recent: [Browser Second, Browser Main]
  - action: delete_project_file       # reverse direction: a file removed at runtime
    project: Browser Main
  - action: wait_for_render           # CAPABILITY: render tick
  - expect:
      project: Browser Second
      left_column:
        projects:
          rows:
            - { name: "Browser Second", current: true, missing: false, open_disabled: false }
            - { name: "Browser Main", current: false, missing: true, open_disabled: true, forget: true }
  - action: restore_project_file      # reversal: the flag clears again
    project: Browser Main
  - action: wait_for_render           # CAPABILITY: render tick
  - expect:
      left_column:
        projects:
          rows:
            - { name: "Browser Second", current: true, missing: false, open_disabled: false }
            - { name: "Browser Main", current: false, missing: false, open_disabled: false, forget: true }
  - snapshot: browser-missing-recovered
```

# P3 opening. A non-current row opens through the existing open path: project,
# engine cursor, outline and session all follow it. Clicking the open row is a
# no-op. A failed open shows the error inline under the list and changes
# neither the open project nor the rows.
#
# The failed-open fixture is a readable `.cjcp` whose `format_version` is newer
# than this build supports. It exists, so the row is not `missing`; the open
# itself is refused. See the notes if "cannot be read" is intended to include a
# file that cannot be parsed.

```yaml
id: controller-project-browser-open
feature: [ui.projects.recent, ui.projects.row]
contract: [ui-project-browser/P3, ui-project-browser/P8]
fixture: fixtures/controller-project-browser-main.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - action: set_session_value         # CAPABILITY: session seed
    name: recent
    value: [Browser Main, Browser Second, Browser Broken]
  - action: launch_app                # CAPABILITY: lifecycle control
  - expect:
      project: Browser Main
      left_column:
        projects:
          rows:
            - { name: "Browser Main", current: true, missing: false, forget: false }
            - { name: "Browser Second", current: false, missing: false, forget: true }
            - { name: "Browser Broken", current: false, missing: false, forget: true }
  - action: select_tab
    tab: shows                        # normalise the drawer for the content check
  - expect:
      drawer: { active_tab: shows }
      render_state_unchanged: true
  - snapshot: browser-open-before
  - action: click_project_row
    project: Browser Second
  - expect:
      project: Browser Second
      left_column:
        projects:
          row_count: 3
          rows:
            - { name: "Browser Second", current: true, missing: false, forget: false }
            - { name: "Browser Main", current: false, missing: false, forget: true }
            - { name: "Browser Broken", current: false, missing: false, forget: true }
      session:
        recent: [Browser Second, Browser Main, Browser Broken]
      live_show: Second Show
      drawer:
        active_tab: shows
        content:
          tab: shows
          items:
            - { kind: show, name: "Second Show", live: true }
          row_count: 1
      render_state:
        project: Browser Second
        show: Second Show
        slide_id: second-1
        position: 1
        total: 2
  - action: select_tab
    tab: media                        # the media list follows the open project too
  - expect:
      drawer:
        active_tab: media
        content:
          tab: media
          rows:
            - { name: "second-bg.jpg", kind: image, origin: bundled, missing: false }
      render_state_unchanged: true
  - action: select_tab
    tab: shows
  - expect:
      drawer: { active_tab: shows }
  - snapshot: browser-open-second
  - action: click_project_row
    project: Browser Second           # the open row: no-op
  - expect:
      unchanged_since: browser-open-second
  - action: click_project_row
    project: Browser Main             # reversal
  - expect:
      project: Browser Main
      left_column:
        projects:
          rows:
            - { name: "Browser Main", current: true, missing: false, forget: false }
            - { name: "Browser Second", current: false, missing: false, forget: true }
            - { name: "Browser Broken", current: false, missing: false, forget: true }
      session:
        recent: [Browser Main, Browser Second, Browser Broken]
  - action: click_project_row
    project: Browser Broken           # failed open
  - expect:
      project: Browser Main           # the open project did not change
      error:
        present: true
        inline: true
        position: below_list          # CAPABILITY: DOM structural
        text_nonempty: true           # wording is today's, not fixed by P3
      left_column:
        projects:
          row_count: 3                # the row is not removed
          rows:
            - { name: "Browser Main", current: true, missing: false, forget: false }
            - { name: "Browser Second", current: false, missing: false, forget: true }
            - { name: "Browser Broken", current: false, missing: false, forget: true }
      session:
        recent: [Browser Main, Browser Second, Browser Broken]
      render_state_unchanged: true
  - snapshot: browser-open-failed
  - action: click_project_row
    project: Browser Second           # an open after a failure still works
  - expect:
      project: Browser Second
      left_column:
        projects:
          rows:
            - { name: "Browser Second", current: true, missing: false, forget: false }
            - { name: "Browser Main", current: false, missing: false, forget: true }
            - { name: "Browser Broken", current: false, missing: false, forget: true }
      session:
        recent: [Browser Second, Browser Main, Browser Broken]
      # The contract does not say whether the previous error is cleared by a
      # later successful open, so the error is not asserted here.
```

# P4 forgetting. Forget removes exactly one entry from the session and the
# panel, never touches the file, never offers itself on the open project's row,
# and shows no confirmation. Re-opening the project restores the entry. With
# one open project and no others the panel shows just the open project (P5),
# not the empty state.

```yaml
id: controller-project-browser-forget
feature: [ui.projects.actions, ui.projects.recent]
contract: [ui-project-browser/P4, ui-project-browser/P5]
fixture: fixtures/controller-project-browser-main.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - action: set_session_value         # CAPABILITY: session seed
    name: recent
    value: [Browser Main, Browser Second, Browser Third]
  - action: launch_app                # CAPABILITY: lifecycle control
  - expect:
      project: Browser Main
      left_column:
        projects:
          row_count: 3
          rows:
            - { name: "Browser Main", current: true, forget: false }
            - { name: "Browser Second", current: false, forget: true }
            - { name: "Browser Third", current: false, forget: true }
      session:
        recent: [Browser Main, Browser Second, Browser Third]
  - snapshot: browser-forget-before
  - action: forget_project
    project: Browser Second
  - expect:
      project: Browser Main
      left_column:
        projects:
          row_count: 2
          rows:
            - { name: "Browser Main", current: true, forget: false }
            - { name: "Browser Third", current: false, forget: true }
      session:
        recent: [Browser Main, Browser Third]
      files:
        Browser Second: present       # P4: the file on disk is untouched
      confirmation_shown: false       # CAPABILITY: DOM structural
      render_state_unchanged: true
  - action: forget_project
    project: Browser Third
  - expect:
      project: Browser Main
      left_column:
        projects:
          row_count: 1
          empty: false                # P5: just the open project, not the empty state
          rows:
            - { name: "Browser Main", current: true, forget: false }
      session:
        recent: [Browser Main]
      files:
        Browser Third: present
  - snapshot: browser-forgotten
  - action: click_project_row
    project: Browser Main             # the open row still works and is a no-op
  - expect:
      unchanged_since: browser-forgotten
  - action: quit_app                  # CAPABILITY: lifecycle control
  - open_project: Browser Second      # re-opening restores the forgotten entry
  - expect:
      project: Browser Second
      left_column:
        projects:
          row_count: 2
          rows:
            - { name: "Browser Second", current: true, forget: false }
            - { name: "Browser Main", current: false, forget: true }
      session:
        recent: [Browser Second, Browser Main]
```

# P4's "forgetting the last entry leaves the empty state" is only reachable
# when no file-backed project is open: the open project's row is never
# forgettable, and P5 says an open project with no others shows just itself.
# Here the session's newest entry is missing, so startup falls back to the demo
# (no open project) and both stale rows are forgettable. The empty state
# arrives after the second Forget; restoring the file and relaunching brings a
# row back.

```yaml
id: controller-project-browser-forget-last
feature: [ui.projects.actions, ui.projects.recent]
contract: [ui-project-browser/P4, ui-project-browser/P5]
fixture: fixtures/controller-project-browser-a.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - action: delete_project_file       # CAPABILITY: filesystem control
    project: Browser A
  - action: delete_project_file       # CAPABILITY: filesystem control
    project: Browser B
  - action: set_session_value         # CAPABILITY: session seed
    name: recent
    value: [Browser A, Browser B]
  - action: launch_app                # CAPABILITY: lifecycle control
  - expect:
      project: null                   # the newest recent cannot be read: demo fallback
      left_column:
        projects:
          row_count: 2
          empty: false
          rows:
