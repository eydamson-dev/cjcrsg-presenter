# Controller drawer — parity scenarios (DEV-013 milestone 1)
#
# Contract: docs/contracts/ui-drawer.md, behaviours B1–B12.
# Reference evidence: parity/features/controller-layout.yaml and
#   parity/reports/reader/controller-layout-2026-11-09.md.
# Reference commit: ff784eb388c7baef60d67e6d4e7c504f4322bca3 (1.6.8-beta.3).
#
# ## Harness status — read this first
#
# The controller is a **native WebView window**. The current parity harness has
# no adapter that can drive it: `parity/adapters/` drives the slide renderer as
# a web build and checks desktop-level behaviour with a separate, smaller set of
# native tests (`docs/parity-workflow.md` §3.3, D13). No scenario in this file
# can therefore be executed by `parity run` today.
#
# They are written so that:
#
#   1. an operator can run them by hand against the real controller now
#      (`GDK_BACKEND=x11 cargo run -p cjcrsg-presenter`, project fixtures from
#      `parity/fixtures/`), and
#   2. a future Electron/Playwright adapter — or a DOM harness over a web build
#      of the controller — can execute them unchanged.
#
# Steps that need a capability the current harness lacks are marked
# `# CAPABILITY:` inline. They are **not passes**: an adapter that cannot
# perform a step must fail loudly, never skip it (`docs/parity-workflow.md`
# §3.2). A manual run may perform them by hand; a runner must not report them
# green until an adapter can.
#
# The gesture and geometry scenarios need a project and a show but do not
# assert the content rows. The content scenarios need the proposed fixtures at
# the end of this file; until those are authored, those rows cannot be run
# literally by hand.
#
# ## Conventions
#
# - Actions are operator intent, never selectors or coordinates. The adapter
#   maps them to the UI.
# - `viewports` are the WebView **content box** (`innerWidth` × `innerHeight`),
#   not the outer window. `1280x800` therefore means `innerHeight == 800` and
#   `max_height == 760`.
# - Tabs are named by id in actions (`action: select_tab` with `tab: media`).
#   The visible labels, which include the digit, are asserted separately.
# - `expect` is the normalised state after the preceding step. `drawer`,
#   `tab_strip`, `content`, `clock`, `stage_message` and `render_state_*` are
#   the controller-side fields; the harness engineer implements their schema
#   from these names.
# - `project` and `show` are the loaded project and show; `live_show` is the
#   show currently live. `focus` names the control that has keyboard focus.
# - `media_list_instances` counts rendered media lists on the controller screen
#   (B12); `content.row_count` is the number of rows in the active tab.
# - `render_state_unchanged: true` compares the published render state (active
#   slide, slide content, outputs) with the previous expect. This is how B12
#   ("the drawer is a consumer") is checked; revision numbers are ignored.
# - `unchanged_since: <snapshot>` compares the drawer/tab/content state with a
#   named snapshot, ignoring the clock.
# - Clock assertions use a deterministic clock (`freeze_clock`, `advance_clock`)
#   so the seconds are stable. A manual run uses the real clock and checks the
#   format plus that the seconds tick.
# - `start_session: fresh` means launch with an empty session directory
#   (`CJCRSG_DATA_DIR`), so there is no remembered height and no recent
#   projects. `restart_app` reuses the same directory.
# - `set_session_value` names a semantic session field
#   (`drawer_remembered_height`); the adapter maps it to the session file's key.
# - The fixtures named here are proposed by this stage and are **not created**
#   by it. See "Proposed fixtures" at the end.
#
# ## Semantic actions used here
#
#   select_tab <id>           single click on a tab; from collapsed it opens
#   click_strip_background    click the empty strip, not a tab or button
#   double_click_tab <id>
#   drag_hold <to_height>     press on the strip, move to the height, hold
#     grab: strip_background | top_edge_bar | tab_button
#   drag_drawer <to_height>   press, move and release in one gesture
#     (defaults to grab: strip_background)
#   release_drag              release a held drag
#   press_shortcut <chord>
#   focus_control <name>      page_body, stage_message_input
#   type_text <text>
#   play_show <name>          activate the Play control on a show row
#   scroll_content {to: end}
#   scroll_tab_strip {to: end}
#
#   Environment setup (all CAPABILITY: the harness has no session or clock
#   control today):
#   start_session: fresh · quit_app · launch_app · restart_app
#   set_session_value {name, value} · freeze_clock · advance_clock
#
# ---------------------------------------------------------------------------

# Geometry: collapsed 40, default open 300, maximum innerHeight - 40.
#
# The initial open/collapsed state after `start_session: fresh` is not asserted:
# the contract states the default *open* height, not whether the drawer starts
# open. `select_tab shows` normalises either initial state to open 300 (if
# already open on Shows it is an active-tab click and changes nothing; if
# collapsed it opens to the default).

```yaml
id: controller-drawer-geometry
feature: [ui.drawer.height.bounds]
contract: [ui-drawer/B1, ui-drawer/B4, ui-drawer/B12]
fixture: fixtures/controller-drawer-project.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - open_project: Controller Drawer Fixture
  - expect:
      project: Controller Drawer Fixture
  - open_show: Worship
  - expect:
      show: Worship
  - action: select_tab
    tab: shows
  - expect:
      drawer:
        open: true
        height: 300          # B1 default open height
        strip_height: 40     # B1
        content_height: 260  # B1: height - 40
        max_height: 760      # B1: innerHeight 800 - 40
        spans_window_width: true    # scope; CAPABILITY: layout measurement
        below_main_columns: true    # scope; CAPABILITY: layout measurement
        active_tab: shows
      strip_handle:
        height: 4            # B1; CAPABILITY: computed style
        accent_tinted: true  # B1; CAPABILITY: computed style
      render_state_unchanged: true   # B12
  - action: drag_hold
    to_height: 520
    grab: tab_button       # B1: buttons are excluded from the drag surface
  - expect:
      drawer:
        open: true
        height: 300        # no resize: the gesture started on a tab button
  - action: release_drag
  - expect:
      drawer:
        open: true
        height: 300
  - action: double_click_tab
    tab: shows
  - expect:
      drawer:
        open: false
        height: 40
        content_height: 0
        remembered_height: 300   # B5: collapse records the current height
        active_tab: shows
  - action: click_strip_background
  - expect:
      drawer:
        open: true
        height: 300
        content_height: 260
        remembered_height: 300
      render_state_unchanged: true
  - action: drag_hold
    to_height: 2000
    grab: strip_background   # B1: the whole strip is the drag surface
  - expect:
      drawer:
        height: 760            # clamped to innerHeight - 40
        max_height: 760
        remembered_height: 300 # B4: persisted after release, not during
  - action: release_drag
  - expect:
      drawer:
        open: true
        height: 760
        content_height: 720
        remembered_height: 760
  - action: drag_hold
    to_height: 0
    grab: top_edge_bar        # B1: the 4 px bar is a grab point too
  - expect:
      drawer:
        height: 40             # B4 lower clamp
  - action: release_drag
  - expect:
      drawer:
        open: false
        height: 40
        # remembered_height is deliberately not asserted after a sub-80
        # release: B4 collapses to 40, and B5 says the collapsed height is not
        # used as the remembered height, but does not say what replaces it.
  - snapshot: drawer-geometry-collapsed
```

# Tab strip: order, labels, default tab, and selection changing content.
# Labels are asserted once; a selection must not reorder or relabel them.

```yaml
id: controller-drawer-tabs
feature: [ui.drawer.tabs.set, ui.drawer.tab.select]
contract: [ui-drawer/B2, ui-drawer/B3, ui-drawer/B12]
fixture: fixtures/controller-drawer-project.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - open_project: Controller Drawer Fixture
  - open_show: Worship
  - expect:
      project: Controller Drawer Fixture
      show: Worship
      drawer:
        active_tab: shows   # B2 default tab
      tab_strip:
        labels:
          - "1 Shows"
          - "2 Media"
          - "3 Audio"
          - "4 Overlays"
          - "5 Templates"
          - "6 Scripture"
          - "7 Calendar"
          - "8 Functions"
        wrapped: false                    # CAPABILITY: layout
        labels_visible: true              # CAPABILITY: layout
        active_underline_px: 2            # B2; CAPABILITY: computed style
        active_background_lighter: true   # B2; CAPABILITY: computed style
  - action: select_tab
    tab: shows
  - expect:
      drawer: { open: true, height: 300, active_tab: shows }
      content: { tab: shows }
      render_state_unchanged: true
  - action: select_tab
    tab: media
  - expect:
      drawer: { open: true, height: 300, active_tab: media }
      content: { tab: media }
      tab_strip:
        active_underline_px: 2            # the underline follows the active tab
      render_state_unchanged: true
  - snapshot: drawer-tabs-media
  - action: select_tab
    tab: audio
  - expect:
      drawer: { open: true, height: 300, active_tab: audio }
      content: { tab: audio }
  - action: select_tab
    tab: overlays
  - expect:
      drawer: { open: true, height: 300, active_tab: overlays }
      content: { tab: overlays, heading: "Overlays" }
  - action: select_tab
    tab: shows              # reversal
  - expect:
      drawer: { open: true, height: 300, active_tab: shows }
      content: { tab: shows }
  - snapshot: drawer-tabs-shows
  - action: select_tab
    tab: shows              # active tab, drawer open: B3 says nothing changes
  - expect:
      drawer: { open: true, height: 300, active_tab: shows }
      content: { tab: shows }
      unchanged_since: drawer-tabs-shows
```

# Narrow strip: labels stay visible and the strip scrolls horizontally; it
# never wraps (B2, DEV-014: no 750 px icon-only cut-off).
#
# If the window manager enforces a minimum wider than 400 px, run this at that
# minimum and record the width. Do not skip the check.

```yaml
id: controller-drawer-tabs-narrow
feature: [ui.drawer.tabs.set, ui.drawer.strip.scroll-labels]
contract: [ui-drawer/B2]
fixture: fixtures/controller-drawer-project.cjcp
viewports: ["400x600"]
steps:
  - start_session: fresh
  - open_project: Controller Drawer Fixture
  - open_show: Worship
  - expect:
      project: Controller Drawer Fixture
      show: Worship
      tab_strip:
        labels:
          - "1 Shows"
          - "2 Media"
          - "3 Audio"
          - "4 Overlays"
          - "5 Templates"
          - "6 Scripture"
          - "7 Calendar"
          - "8 Functions"
        wrapped: false            # CAPABILITY: layout
        labels_visible: true      # DEV-014: labels are not hidden by width
        scrollable_x: true        # eight labels cannot fit in 400 px
        active_underline_px: 2    # B2; CAPABILITY: computed style
        active_background_lighter: true   # B2; CAPABILITY: computed style
  - action: scroll_tab_strip   # CAPABILITY: no adapter scrolls the strip today
    to: end
  - expect:
      tab_strip:
        last_label_visible: true  # "8 Functions" is reachable by scrolling
        wrapped: false
```

# Opening from collapsed by clicking a tab: the drawer uses the remembered
# height and then selects the tab.

```yaml
id: controller-drawer-open-from-collapsed
feature: [ui.drawer.tab.select, ui.drawer.height.persisted]
contract: [ui-drawer/B3, ui-drawer/B5]
fixture: fixtures/controller-drawer-project.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - open_project: Controller Drawer Fixture
  - expect:
      project: Controller Drawer Fixture
  - action: select_tab
    tab: shows
  - expect:
      drawer: { open: true, height: 300, active_tab: shows }
  - action: drag_drawer
    to_height: 520
  - expect:
      drawer:
        open: true
        height: 520
        remembered_height: 520
  - action: double_click_tab
    tab: shows
  - expect:
      drawer:
        open: false
        height: 40
        remembered_height: 520
  - action: select_tab
    tab: shows              # collapsed even though Shows is already active
  - expect:
      drawer:
        open: true
        height: 520          # B3: a collapsed tab click still opens
        remembered_height: 520
        active_tab: shows
  - action: double_click_tab
    tab: shows
  - expect:
      drawer:
        open: false
        height: 40
        remembered_height: 520
  - action: select_tab
    tab: media
  - expect:
      drawer:
        open: true
        height: 520          # B3: opens to the remembered open height
        remembered_height: 520
        active_tab: media    # B3: then selects the tab
      content: { tab: media }
  - action: double_click_tab
    tab: media
  - expect:
      drawer:
        open: false
        height: 40
        remembered_height: 520
  - action: select_tab
    tab: audio             # reversal: a different tab, same remembered height
  - expect:
      drawer:
        open: true
        height: 520
        remembered_height: 520
        active_tab: audio
      content: { tab: audio }
```

# Clicking the empty strip toggles. The reopened height is asserted only where
# the remembered height is 300, because B3 names the remembered height for a
# tab click but not for a strip background click; with a remembered height of
# 300 both the remembered value and the default agree.

```yaml
id: controller-drawer-strip-toggle
feature: [ui.drawer.collapse.pointer]
contract: [ui-drawer/B3, ui-drawer/B5, ui-drawer/B12]
fixture: fixtures/controller-drawer-project.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - open_project: Controller Drawer Fixture
  - expect:
      project: Controller Drawer Fixture
  - action: select_tab
    tab: shows
  - expect:
      drawer: { open: true, height: 300, active_tab: shows }
  - action: click_strip_background
  - expect:
      drawer:
        open: false
        height: 40
        remembered_height: 300
        active_tab: shows      # the strip click must not change the tab
      render_state_unchanged: true
  - action: click_strip_background
  - expect:
      drawer:
        open: true
        height: 300
        remembered_height: 300
        active_tab: shows
      render_state_unchanged: true
  - action: click_strip_background   # repeated
  - expect:
      drawer: { open: false, height: 40, remembered_height: 300 }
  - action: click_strip_background   # reversal
  - expect:
      drawer: { open: true, height: 300, remembered_height: 300 }
```

# Double-clicking a tab collapses. The active tab after the gesture is not
# asserted: a double click contains two clicks, and the contract does not say
# whether the first one selects the tab before the drawer closes.

```yaml
id: controller-drawer-double-click-collapse
feature: [ui.drawer.collapse.pointer]
contract: [ui-drawer/B3, ui-drawer/B5, ui-drawer/B12]
fixture: fixtures/controller-drawer-project.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - open_project: Controller Drawer Fixture
  - expect:
      project: Controller Drawer Fixture
  - action: select_tab
    tab: shows
  - expect:
      drawer: { open: true, height: 300, active_tab: shows }
  - action: double_click_tab
    tab: shows
  - expect:
      drawer:
        open: false
        height: 40
        remembered_height: 300
      render_state_unchanged: true
  - action: click_strip_background
  - expect:
      drawer: { open: true, height: 300, remembered_height: 300 }
  - action: double_click_tab
    tab: media
  - expect:
      drawer:
        open: false
        height: 40
        remembered_height: 300
  - action: click_strip_background
  - expect:
      drawer: { open: true, height: 300 }
  - action: double_click_tab
    tab: shows
  - expect:
      drawer: { open: false, height: 40, remembered_height: 300 }
  - action: double_click_tab
    tab: shows              # repeated while already collapsed
  - expect:
      drawer: { open: false, height: 40 }
```

# Drag resize: normal growth and shrink, the 79/80/81 release boundary, clamp
# at the maximum, and the rule that the height is persisted on release rather
# than during the drag.

```yaml
id: controller-drawer-drag-resize
feature: [ui.drawer.drag.resize, ui.drawer.height.bounds, ui.drawer.height.persisted]
contract: [ui-drawer/B1, ui-drawer/B3, ui-drawer/B4, ui-drawer/B5]
fixture: fixtures/controller-drawer-project.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - open_project: Controller Drawer Fixture
  - expect:
      project: Controller Drawer Fixture
  - action: select_tab
    tab: shows
  - expect:
      drawer: { open: true, height: 300, active_tab: shows }
  - action: double_click_tab
    tab: shows              # establish a known remembered height of 300
  - expect:
      drawer: { open: false, height: 40, remembered_height: 300 }
  - action: click_strip_background
  - expect:
      drawer: { open: true, height: 300, remembered_height: 300 }
  - action: drag_hold
    to_height: 520
    grab: top_edge_bar
  - expect:
      drawer:
        open: true
        height: 520
        remembered_height: 300   # B4: not persisted until release
  - action: release_drag
  - expect:
      drawer:
        open: true
        height: 520
        remembered_height: 520   # B4: kept and recorded on release
  - action: drag_drawer
    to_height: 300
    grab: strip_background      # B1: drag anywhere on the strip
  - expect:
      drawer:
        open: true
        height: 300
        remembered_height: 300   # reversal: shrink is kept and recorded
  - action: drag_drawer
    to_height: 79
  - expect:
      drawer:
        open: false              # B4: below 80 collapses
        height: 40
        # remembered_height is not asserted: see the geometry scenario note.
  - action: drag_drawer
    to_height: 80
  - expect:
      drawer:
        open: true               # B4: at 80 the height is kept
        height: 80
        remembered_height: 80
  - action: double_click_tab
    tab: shows
  - expect:
      drawer: { open: false, height: 40, remembered_height: 80 }
  - action: select_tab
    tab: media                 # B3: a remembered height below 300 is used
  - expect:
      drawer:
        open: true
        height: 80
        remembered_height: 80
        active_tab: media
  - action: select_tab
    tab: shows                 # back to Shows for the next drag
  - expect:
      drawer: { open: true, height: 80, active_tab: shows }
  - action: drag_drawer
    to_height: 81
  - expect:
      drawer:
        open: true
        height: 81
        remembered_height: 81
  - action: drag_hold
    to_height: 2000
  - expect:
      drawer:
        open: true
        height: 760              # upper clamp at innerHeight 800 - 40
        max_height: 760
        remembered_height: 81    # still not persisted during the drag
  - action: release_drag
  - expect:
      drawer:
        open: true
        height: 760
        remembered_height: 760
```

# Remembered height across a restart. The drawer's current height immediately
# after relaunch is not asserted: B5 promises the remembered *open* height, not
# the launch state. Opening by clicking a tab reaches the remembered height
# whether the app restarted open or collapsed.

```yaml
id: controller-drawer-persistence
feature: [ui.drawer.height.persisted]
contract: [ui-drawer/B5]
fixture: fixtures/controller-drawer-project.cjcp
viewports: ["1280x800"]
steps:
  - start_session: fresh
  - open_project: Controller Drawer Fixture
  - expect:
      project: Controller Drawer Fixture
  - action: select_tab
    tab: shows
  - expect:
      drawer: { open: true, height: 300, active_tab: shows }
  - action: drag_drawer
    to_height: 520
  - expect:
      drawer: { open: true, height: 520, remembered_height: 520 }
  - action: double_click_tab
    tab: shows
  - expect:
      drawer: { open: false, height: 40, remembered_height: 520 }
  - action: restart_app        # CAPABILITY: no session/restart adapter today
  - expect:
      app: { running: true }
  - open_project: Controller Drawer Fixture   # no-op if the app restores it
  - expect:
      project: Controller Drawer Fixture
  - action: select_tab
    tab: shows
  - expect:
      drawer:
        open: true
        height: 520            # B5: remembered open height survived
        remembered_height: 520
        active_tab: shows
  - snapshot: drawer-after-restart
```

# Hand-edited session value above the 40..=1200 range. The tall viewport makes
# innerHeight - 40 (1360) larger than 1200, so the rendered height proves the
# 1200 clamp rather than the window clamp.
#
# CAPABILITY: this needs a WebView content height above 1240 px. A 1080p desktop
# cannot show it; use a virtual display, a DOM adapter, or an oversized window.
# If none is available, record the measured max and do not claim the 1200 clamp.

```yaml
id: controller-drawer-session-clamp-high
feature: [ui.drawer.height.persisted]
contract: [ui-drawer/B5]
fixture: fixtures/controller-drawer-project.cjcp
viewports: ["1280x1400"]
steps:
  - start_session: fresh
  - quit_app                   # CAPABILITY: no session adapter today
  - action: set_session_value
    name: drawer_remembered_height
    value: 1201
  - action: launch_app
  - expect:
      app: { running: true }
  - open_project: Controller Drawer Fixture
  - expect:
      project: Controller Drawer Fixture
  - action: select_tab
    tab: shows
  - expect:
      drawer:
        open: true
        height: 1200           # B5: clamped to 40..=1200
        max_height: 1360       # innerHeight 1400 - 40, so not the window clamp
        # remembered_height is not asserted: the contract does not say whether
        # the clamped value is written back to the session or only used.
```

# Hand-edited session value above the range, at a viewport where the window
# clamp is the tighter one: 1201 -> 1200 by the session clamp, then 760 by
# innerHeight - 40. This is the "then again when rendered" half of B5.

```yaml
