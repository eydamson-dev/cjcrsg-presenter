## Coverage map

| Contract | Scenarios |
| --- | --- |
| B1 geometry, content area, drag surface | `controller-drawer-geometry`, `controller-drawer-content-overflow` |
| B2 tab strip, order, labels, styling, narrow widths | `controller-drawer-tabs`, `controller-drawer-tabs-narrow` |
| B3 selection, opening from collapsed, strip toggle, double-click | `controller-drawer-tabs`, `controller-drawer-open-from-collapsed`, `controller-drawer-strip-toggle`, `controller-drawer-double-click-collapse`, `controller-drawer-drag-resize` |
| B4 drag resize, 79/80/81, clamp, persistence after release | `controller-drawer-drag-resize`, `controller-drawer-geometry` |
| B5 remembered height, restart, hand-edit clamps | `controller-drawer-open-from-collapsed`, `controller-drawer-drag-resize`, `controller-drawer-persistence`, `controller-drawer-session-clamp-high`, `controller-drawer-session-clamp-max`, `controller-drawer-session-clamp-low` |
| B6 Ctrl+1..8, at least 300, input ignored, no other shortcut | `controller-drawer-shortcuts`, `controller-drawer-shortcuts-input-focus` |
| B7 Shows content | `controller-drawer-content-shows` |
| B8 Media content | `controller-drawer-content-media` |
| B9 Audio content and its empty state | `controller-drawer-content-audio`, `controller-drawer-content-audio-empty` |
| B10 the five empty tabs | `controller-drawer-empty-tabs` |
| B11 clock and date on every tab | `controller-drawer-clock` |
| B12 consumer, one media list | `render_state_unchanged` in the geometry/tabs/strip/double-click/shortcuts steps; `media_list_instances` in `controller-drawer-content-media` |

## Notes and unresolved clauses

- **Not covered here: "no engine change" (B12).** That is a code and
  architecture claim, verified by the existing engine tests and by review of the
  candidate diff, not by a UI scenario. "No output-window change" is covered
  only as far as `render_state_unchanged`; window lifecycle stays with the
  existing output scenarios.
- **B4/B5 remembered value after a drag-collapse below 80.** B4 collapses to 40;
  B5 says collapsing records the current height but that the collapsed height is
  not used. The contract does not say whether 79 is recorded or discarded, so
  the 79 px case asserts the collapsed height only. The next drag (80 px)
  overwrites the remembered value, so nothing downstream depends on it.
- **B3/B5 remembered height below 300.** The reference reopens at `stored`
  only when it is >= 300, otherwise at 300 (reader report §1.2). The contract
  says a tab click opens to "the remembered open height", allows a remembered
  value from 40, and B4 records an 80 px release. The drag scenario therefore
  asserts that a remembered 80 opens at 80. If the reference's 300 px floor was
  intended, the contract needs to say so.
- **B5 hand-edited value write-back.** The contract says the value is clamped
  before use; it does not say whether the clamped 1200 is written back to the
  session. Only the rendered height is asserted.
- **B3 strip-toggle open height with a remembered height other than 300.** B3
  names the remembered height for a tab click, not for a strip background
  click. The strip scenario therefore establishes a remembered height of 300,
  where the remembered value and the default agree.
- **B3 collapsed click on the already-active tab.** The reference's
  `openDrawerTab` returns early when the tab is already active (reader report
  §1.3 / `ui.drawer.tab.select`), but the contract does not except that case
  from "clicking a tab when the drawer is collapsed opens it". The
  open-from-collapsed scenario follows the contract and asserts that the drawer
  opens. If the reference's early return was intended, the contract needs an
  explicit exception.
- **B3 active tab after a double-click.** A double click contains two clicks;
  the contract does not say whether the first selects the tab before the drawer
  closes. The double-click scenario avoids asserting the active tab.
- **B1 open state at exactly 40 px.** B1 calls 40 the collapsed height and B5
  allows a remembered value of 40; the contract does not say which wins. The
  low-clamp scenario asserts the height only.
- **B6 textarea and select.** B6 names `input`, `textarea` and `select`. Only
  the stage-message input exists in this milestone's surface, so only that case
  is exercised. If a textarea or select is added to the controller, extend
  `controller-drawer-shortcuts-input-focus` rather than adding a new ID.
- **Empty Shows and Media.** B7 and B8 do not state what those tabs show when
  the project has no shows or no non-audio media; only B9 names an audio-empty
  state. No expectation is asserted for those two empty cases, because the
  contract gives no sentence to check. Do not invent one.
- **B8 human-readable size.** The contract fixes "human-readable", not the unit
  set or rounding. The scenario asserts `size_human_readable`, not a literal
  string or a particular unit.
- **B10 heading wording.** The contract says "the tab's name", so the heading is
  asserted as `Overlays`, `Templates`, etc., not the strip label with its digit
  (`4 Overlays`). The digit is a shortcut hint, not part of the name.
- **B9 empty-audio wording.** The contract says "the tab says so" but gives no
  sentence. The scenario asserts a message is present and mentions audio, not a
  literal string.
- **B11 date literal.** The reference date is locale-dependent
  (`toLocaleDateString`; reader report §1.7). The scenario asserts the structured
  date parts and that a long-form weekday is present, not a literal English
  string. The frozen date 2026-11-09 is a Monday in the Gregorian calendar; if
  the test machine's locale uses another calendar, record its parts and do not
  treat the mismatch as a product failure.
- **Visual claims.** Active-tab underline and background, the 4 px accent bar,
  the clock's accent colour and centring, label visibility, and the drawer's
  full-width placement below the three columns are computed-style or layout
  claims. They are marked `# CAPABILITY:` inline; a DOM adapter with computed
  style and bounding boxes, or a capture, must provide them.
- **Feature-inventory gap.** The reader's entries cover the drawer frame, tabs,
  heights, drag, shortcuts and clock, but not the Shows, Media, Audio or
  empty-tab content (B7–B10). Those scenarios link to
  `ui.drawer.content.columns` as the nearest existing entry and carry the
  contract clause; the inventory should gain entries for them.
- **Out of scope.** Drawer search, the per-tab left sub-column, per-tab info
  panels, profile access, Ctrl+D/Ctrl+T as drawer toggles, and the reference
  icon set are outside this milestone (contract Scope). The only related checks
  are the B6 negative shortcuts and the text-only labels; their absence is not
  otherwise asserted.
- **Fixture dependency.** The content expectations are tied to the proposed
  fixtures below. A different fixture changes the expected rows, not the
  contract.

