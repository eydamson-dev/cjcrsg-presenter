name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Library crates only: no display, no WebView, no system libraries. Fast enough
  # to run on every OS, which is the point — it exercises Windows paths.
  library:
    name: library (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: >
          cargo clippy
          -p presenter-core -p presenter-compat -p presenter-remote
          --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p presenter-core -p presenter-compat -p presenter-remote

  # The full workspace on Linux: builds the desktop shell and checks that
  # EVIDENCE.md still declares the right test count.
  desktop-linux:
    name: desktop (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the desktop shell
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: ./scripts/check.sh

      # A per-user tarball: binary, desktop entry, icon and installer.
      - name: Package (Linux x64)
        run: |
          cargo build --release -p cjcrsg-presenter
          mkdir -p dist/linux
          cp target/release/cjcrsg-presenter dist/linux/
          cp installer/linux/cjcrsg-presenter.desktop dist/linux/
          cp installer/linux/cjcrsg-presenter.svg dist/linux/
          cp installer/linux/install.sh dist/linux/
          cp README.md LICENSE dist/linux/ 2>/dev/null || true
          tar -C dist/linux -czf dist/cjcrsg-presenter-linux-x64.tar.gz .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: cjcrsg-presenter-linux-x64
          path: dist/cjcrsg-presenter-linux-x64.tar.gz
          if-no-files-found: error

  # First real Windows build of the shell. Compiling proves the crate graph and
  # the MSVC link path; it does not prove the app runs (see docs/windows.md).
  desktop-windows:
    name: desktop (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (MSVC)
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc -p cjcrsg-presenter

      - name: Manifest is embedded
        shell: pwsh
        run: |
          # DPI awareness must be in the executable, not a runtime setting. The
          # manifest ships as plain text inside the resource section, so its
          # presence is checkable without a Windows SDK tool.
          $text = [Text.Encoding]::UTF8.GetString(
            [IO.File]::ReadAllBytes("target/x86_64-pc-windows-msvc/release/cjcrsg-presenter.exe"))
          foreach ($needle in @("PerMonitorV2", "longPathAware")) {
            if ($text -notmatch $needle) { throw "manifest is missing $needle" }
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: cjcrsg-presenter-windows-x64
          path: target/x86_64-pc-windows-msvc/release/cjcrsg-presenter.exe
          if-no-files-found: error

      # The installer is built but not run here: NSIS can be executed on a
      # runner, a GUI install cannot. The manual checklist is in docs/windows.md.
      - name: WebView2 Evergreen bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "installer/MicrosoftEdgeWebview2Setup.exe"

      - name: NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=$version" "installer\windows.nsi"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cjcrsg-presenter-windows-x64-installer
          path: dist/*.exe
          if-no-files-found: error
